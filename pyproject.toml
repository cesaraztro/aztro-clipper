[project]
name = "aztro-clipper"
version = "0.1.0"
description = "De un video largo (podcast, entrevista) a clips verticales para TikTok, Reels y Shorts, con CTA para ManyChat y publicación en Metricool."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Propietaria — miembros de la comunidad AztroTech" }
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "faster-whisper>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
clipper = "clipper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clipper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
